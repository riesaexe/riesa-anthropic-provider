[project]
name = "riesa-anthropic-provider"
version = "0.1.3"
description = "MaiBot Anthropic-compatible LLM Provider with optional native web search"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.104.0,<1.0.0",
    "maibot-plugin-sdk>=2.8.1,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
asyncio_mode = "auto"
